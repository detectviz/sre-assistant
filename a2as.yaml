manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: detectviz/sre-assistant
    source: https://github.com/detectviz/sre-assistant
    branch: main
    commit: "e151d2a7"
    scope: [src/sre_assistant/auth/no_auth_provider.py, src/sre_assistant/main.py, src/sre_assistant/memory/backend_factory.py,
      src/sre_assistant/tool_registry.py, src/sre_assistant/tools/control_plane_tool.py, src/sre_assistant/tools/human_approval_tool.py,
      src/sre_assistant/tools/loki_tool.py, src/sre_assistant/tools/prometheus_tool.py, src/sre_assistant/workflow.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T17:01:33Z'
    url: https://a2as.org/certified/agents/detectviz/sre-assistant
  signatures:
    digest: sha256:qJ-D2GYXSTO09YLzhFk5hvAlGZqrifX0V4jlCge6NzQ
    key: ed25519:NGTseKqgKcXvtjBRtgpqSjdfpxr_cCy9HeZ91jg00so
    sig: ed25519:9XRHWmUTr-aUg8-fwRKuvQPzfcQ7tjvafX_7gOAxSFD12gXxoLCHPSocQZdOiB5Jey3Wgbnj8csEFILdDU31Bg

agents:
  agent._create_diagnostic_phase:
    type: factory
    params:
      name: DiagnosticPhase
      function: _create_diagnostic_phase
      sub_agents: [MetricsAnalyzer, LogAnalyzer, ContextFetcher, TraceAnalyzer]
  agent._create_dispatcher_phase:
    type: factory
    models: [gemini-2.5-flash]
    params:
      name: IntelligentDispatcher
      output_key: remediation_decision
      function: _create_dispatcher_phase
  agent._create_verification_phase:
    type: factory
    params:
      name: VerificationPhase
      after_agent_callback: self._check_verification_status
      function: _create_verification_phase
      sub_agents: [HealthCheckAgent, SLOValidationAgent]
  MetricsAnalyzer:
    type: instance
    models: [gemini-1.5-flash]
    params:
      name: name
      instruction: instruction
      function: _create_agent
  sre_workflow:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: EnhancedSREWorkflow
      base: SequentialAgent
      name: EnhancedSREWorkflow
      sub_agents: [diagnostic_phase, dispatcher_phase, remediation_phase, verification_phase]
      before_agent_callback: self._workflow_pre_check
      after_agent_callback: self._workflow_post_process

models:
  gemini-1.5-flash:
    type: literal
    agents: [MetricsAnalyzer]
  gemini-2.5-flash:
    type: default
    agents: [agent._create_dispatcher_phase, sre_workflow]

teams:
  agent._create_diagnostic_phase:
    type: parallel
    agents: [agent._create_diagnostic_phase, MetricsAnalyzer, LogAnalyzer, ContextFetcher, TraceAnalyzer]
  agent._create_verification_phase:
    type: sequential
    agents: [agent._create_verification_phase, HealthCheckAgent, SLOValidationAgent]

